  <g fill="#9b5d70" opacity=".8"><path d="M97 798q18-21 34 0-17 25-34 0m34 13q18-21 34 0-16 25-34 0m580 22q17-22 34-2-15 25-34 2m32-20q16-20 31 1-17 22-31-1"/></g>
  <!-- cloaked figure -->
  <ellipse cx="470" cy="1004" rx="233" ry="30" fill="#08070d" opacity=".78"/>
  <path fill="url(#cloak)" stroke="#604052" stroke-width="2" d="M386 1000q29-183 26-333 1-104 57-131 56 26 59 131-3 151 29 333z"/>
  <path fill="#211722" stroke="#8a6275" stroke-width="2" d="M410 678q3-115 59-150 56 35 59 150l-19 26q-39-24-80 0z"/>
