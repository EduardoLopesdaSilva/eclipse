  <g fill="none" stroke="#09080e" stroke-width="5" stroke-linecap="round"><path d="M197 368q18-20 36 0 19-21 37 0m291-35q15-17 30 0 15-17 30 0"/></g>
  <rect width="900" height="1000" filter="url(#grain)" opacity=".19"/>
</svg>
